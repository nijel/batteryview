name: Documentation

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: python -m pip install uv
      - run: uv sync --group docs --frozen
      - run: uv run --group docs --frozen sphinx-build -n -W --keep-going -b html docs docs/_build/html
