name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  docs:
    uses: ./.github/workflows/docs.yml

  build:
    name: Build distributions
    needs: [tests, docs]
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked --only-group release
      - name: Check release tag
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --locked --only-group release python scripts/check_release.py "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Build sdist and wheel with locked build dependencies
        run: uv build --no-build-isolation --no-create-gitignore
      - name: Validate distributions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --locked --only-group release python scripts/check_release.py "$RELEASE_TAG" --dist dist
          uv run --locked --only-group release twine check --strict dist/*
      - name: Smoke-test the installed wheel outside the checkout
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          uv venv "$RUNNER_TEMP/wheel-smoke"
          uv pip install --python "$RUNNER_TEMP/wheel-smoke/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -I -c 'import os; from importlib.metadata import version; assert version("pylontech-tools") == os.environ["RELEASE_VERSION"]'
          "$RUNNER_TEMP/wheel-smoke/bin/pylontech-console" --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Attest distributions
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - name: Generate SLSA build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          create-storage-record: false
      - name: Save the verification bundle
        env:
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp -- "$ATTESTATION_BUNDLE" provenance.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provenance
          path: provenance.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to PyPI
    needs: attest
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/p/pylontech-tools
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - name: Publish with trusted publishing and PyPI attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true

  github-release:
    name: Publish GitHub release
    needs: [build, publish]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: provenance
      - name: Create release with the published distributions and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* provenance.json \
            --verify-tag --generate-notes --title "$RELEASE_TAG" "${flags[@]}"
