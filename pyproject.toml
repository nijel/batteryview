[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "batteryview"
version = "0.1.0"
description = "Portable Pylontech console client and BatteryView-compatible reports"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["pyserial>=3.5,<4"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
batteryview = "batteryview.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/batteryview"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/batteryview/*.py",
    "/tests/*.py",
    "/tests/README.md",
    "/docs/*.md",
    "/docs/firmware-commands.json",
    "/scripts/extract_firmware_commands.py",
    "/.github/workflows/*.yml",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
]
exclude = ["**/*.swp", "**/*.swo", "**/*~"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
