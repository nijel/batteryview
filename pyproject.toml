[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pylontech-tools"
version = "0.1.0"
description = "Portable Pylontech console client and BatteryView-compatible reports"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["pyserial>=3.5,<4"]

[project.scripts]
pylontech-console = "pylontech_tools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pylontech_tools"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/pylontech_tools/*.py",
    "/tests/*.py",
    "/tests/README.md",
    "/docs/**/*.rst",
    "/docs/conf.py",
    "/.readthedocs.yml",
    "/docs/firmware-commands.json",
    "/docs/firmware-details.json",
    "/scripts/extract_firmware_commands.py",
    "/scripts/extract_firmware_details.py",
    "/.github/workflows/*.yml",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
]
exclude = ["**/*.swp", "**/*.swo", "**/*~"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]
docs = [
    "furo==2025.12.19",
    "sphinx==9.2.0",
    "sphinx-argparse==0.6.1",
    "sphinx-copybutton==0.5.2",
]

[tool.uv.dependency-groups]
docs = { requires-python = ">=3.13" }
