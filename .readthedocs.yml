version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    post_create_environment:
      - pip install uv
    install:
      - VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH uv sync --group docs --no-default-groups --frozen --active --inexact
sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
formats: []
submodules:
  exclude: all
